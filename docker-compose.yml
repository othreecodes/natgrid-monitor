version: '3.8'

services:
  natgrid-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GRID_API_ENDPOINT=${GRID_API_ENDPOINT:-https://niggrid.org}
      - GRID_UPDATE_INTERVAL=${GRID_UPDATE_INTERVAL:-60000}
      - NEXT_PUBLIC_DEFAULT_LOCATION_LAT=${NEXT_PUBLIC_DEFAULT_LOCATION_LAT:-9.0765}
      - NEXT_PUBLIC_DEFAULT_LOCATION_LNG=${NEXT_PUBLIC_DEFAULT_LOCATION_LNG:-7.3986}
      - NEXT_PUBLIC_GRID_UPDATE_INTERVAL=${NEXT_PUBLIC_GRID_UPDATE_INTERVAL:-60000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add reverse proxy for production
